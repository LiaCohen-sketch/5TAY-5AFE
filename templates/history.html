<!DOCTYPE html>

<html lang="en">

    <head>
        <link rel="stylesheet" href="../static/Tabs.css">
        <title>URL History</title>
    </head>

    <style>
        tr{
            font-size:30px;
            width:100%;
            font-family: 'Pixelify Sans';
        }
        .list{
            font-weight: 900;
            color: #000000;
            /*text-align: center;*/
            margin-top: 1.5px;
            margin-left: 20px;
            padding-left: 20px;
            padding-right: 40px;
        }

        .urlList{
            margin-top: 1.5px;
            margin-left: 5vw;
            padding-left: 20px;
            padding-right: 40px;
            gap:10px;        
        }

        #blockList{
            overflow-y: auto;
            overflow-x: auto;
            max-height:38vw;
            max-width: 56%;
        }

        #historyBody{
            color: #000000;
            margin-top: 1.5px;
        }


        #historyBody td{
            padding: 0px 15px;
        }

    </style>

    <body>
        <header id="header"></header>
        <script src="../static/header.js"></script>
        
        <div id="historyWindow" class="Tabs">
            <section id="section">
                <h1>URL History</h1>
                    <div class=urlList id="urllist">
                       <table>
                        <thead>
                            <tr>
                                <th id="url" class="list">URLs</th>
                                <th id="prob" class="list">Problem(s)</th>
                            </tr>
                        </thead>
                            <div id="blockList">
                                <tbody id="historyBody">

                                </tbody>
                            </div>
                       </table>
                    </div>
                </table>
            </section>
        </div>

        <script src="../static/History.js"></script>

    </body>
</html>

<img src="/static/" alt="">
