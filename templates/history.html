<!DOCTYPE html>

<html lang="en">
    
    <head>
        <link rel="stylesheet" href="../static/Tabs.css">
        <title>URL History</title>
    </head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        </style>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Chathura:wght@100;300;400;700;800&display=swap');
            </style>
    <style>
        tr{
            font-size:35px;
            width:100%;
            font-family: "Chathura", sans-serif;
            font-weight: 1000;

            letter-spacing: 3px;

        }

        th{
            font-family: "Press Start 2P", system-ui;
            font-size:20px;
        }
        .list{
            font-weight: 900;
            color: #000000;
            /*text-align: center;*/
            margin-top: 1.5px;
            margin-left: 20px;
            padding-left: 20px;
        }
        
        .urlList{
            margin-top: 1.5px;
            margin-left: 1.3vw;
            padding-right: 40px;
            gap:10px;        

        }

        #blockList{
            overflow-x: auto;
            overflow-y: auto;
            max-height: 25.5vw;
            box-sizing: border-box;
        }


        #blockList table{
            width: 35vw;
            max-width: 35vw;
            table-layout: fixed;
            border-collapse: collapse;
        }

        #blockList th:first-child,
        #blockList td:first-child{
            width: 28vw;
        }

        #blockList th:last-child,
        #blockList td:last-child{
            width:20vw;
            text-align: center;
        }

        #historyBody{
            color: #000000;
            margin-top: 1.5px;
        }


        #historyBody td{
            padding: 0px 15px;
            word-break: break-all;

        }

    </style>

    <body>
        <header id="header"></header>
        <script src="../static/header.js"></script>
        
        <div id="historyWindow" class="Tabs">
            <section id="section">
                <h1>URL History</h1>
                    <div class=urlList id="urllist">
                        <div id="blockList">
                            <table>
                                <thead>
                                    <tr>
                                        <th id="url" class="list">URLs</th>
                                        <th id="prob" class="list">Phishing %</th>
                                    </tr>
                                </thead>
                                <tbody id="historyBody"></tbody>
                            </table>
                        </div>
                    </div>
            </section>
        </div>

        <script src="../static/History.js"></script>

    </body>
</html>
