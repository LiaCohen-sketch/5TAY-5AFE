<!DOCTYPE html>

<html lang="en">

    <head>
        <link rel="stylesheet" href="../static/Tabs.css">
        <title>URL History</title>
    </head>

    <style>
        tr{
            font-size:30px;
            width:100%;
            font-family: 'Pixelify Sans';
        }
        .list{
            font-weight: 900;
            color: #000000;
            /*text-align: center;*/
            margin-top: 1.5px;
            margin-left: 20px;
            padding-left: 20px;
            padding-right: 40px;
        }

        .urlList{
            margin-top: 1.5px;
            margin-left: 5vw;
            padding-left: 20px;
            padding-right: 40px;
            gap:10px;        

        }

        #blockList{
            overflow-x: auto;
            overflow-y: auto;
            max-height: 18vw;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        #blockList table{
            width: 100%;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        #blockList table{
            width: 100%;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        #blockList table{
            width: 100%;
            max-width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        #blockList th:first-child,
        #blockList td:first-child{
            width: 35%;
        }

        #blockList th:last-child,
        #blockList td:last-child{
            width: 35%;
        }

        #historyBody{
            color: #000000;
            margin-top: 1.5px;
        }


        #historyBody td{
            padding: 0px 15px;
        }

    </style>

    <body>
        <header id="header"></header>
        <script src="../static/header.js"></script>
        
        <div id="historyWindow" class="Tabs">
            <section id="section">
                <h1>URL History</h1>
                    <div class=urlList id="urllist">
                        <div id="blockList">
                            <table>
                                <thead>
                                    <tr>
                                        <th id="url" class="list">URLs</th>
                                        <th id="prob" class="list">Phishing %</th>
                                    </tr>
                                </thead>
                                <tbody id="historyBody"></tbody>
                            </table>
                        </div>
                    </div>
            </section>
        </div>

        <script src="../static/History.js"></script>

    </body>
</html>
